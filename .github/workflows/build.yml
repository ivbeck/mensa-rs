name: Build

on:
  push:
    branches: ["master", "release"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: mensa-x86_64-unknown-linux-gnu
            archive: mensa-x86_64-unknown-linux-gnu.tar.gz
            cli: mensa
            gui: mensa-gui
          - os: macos-15-intel
            target: x86_64-apple-darwin
            package: mensa-x86_64-apple-darwin
            archive: mensa-x86_64-apple-darwin.tar.gz
            cli: mensa
            gui: mensa-gui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: mensa-x86_64-pc-windows-msvc
            archive: mensa-x86_64-pc-windows-msvc.zip
            cli: mensa.exe
            gui: mensa-gui.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build CLI and GUI (release)
        run: cargo build --release --features gui --bins --target ${{ matrix.target }}

      - name: Package Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/${{ matrix.package }}"
          mkdir -p "${package_dir}"
          cp "target/${{ matrix.target }}/release/${{ matrix.cli }}" "${package_dir}/"
          cp "target/${{ matrix.target }}/release/${{ matrix.gui }}" "${package_dir}/"
          tar -czf "dist/${{ matrix.archive }}" -C "${package_dir}" .

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "dist/${{ matrix.package }}"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.cli }}" "$packageDir/"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.gui }}" "$packageDir/"
          Compress-Archive -Path "$packageDir/*" -DestinationPath "dist/${{ matrix.archive }}" -Force

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android release APK
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
          ./gradlew :app:assembleRelease

      - name: Package Android APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/mensa-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mensa-android.apk
          path: dist/mensa-android.apk

  release:
    name: Release
    needs: [build, android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_name="${GITHUB_REF_NAME}"
          else
            version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')"
            tag_name="v${version}"
          fi
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: mensa-*
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist/

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true